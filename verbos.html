
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4-Idiomas — Verbo do Dia</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#101b30;color:#fff;font-family:Arial,sans-serif}
main{max-width:950px;margin:auto}
h1{color:#91c8ff}
nav,.botoes{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
nav a,button{background:#2675d8;color:white;border:0;border-radius:9px;padding:11px;text-decoration:none;font-size:15px}
section{background:#192b49;border-radius:14px;padding:16px;margin:15px 0}
label{display:block;margin:12px 0 5px;font-weight:bold}
input,textarea{width:100%;padding:10px;border:1px solid #8498b3;border-radius:8px;background:white;color:#17253b;font-size:16px}
textarea{min-height:110px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dica{color:#c0d0e5;font-size:14px}
#status{color:#9ce6b2}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>📚 4-Idiomas</h1>
<h2>📖 Verbo do Dia</h2>
<nav>
<a href="index.html">🏠 Artigos</a>
<a href="musicas-v44.html">🎵 Músicas</a>
<a href="frases.html">💬 Frases</a>
<a href="verbos.html">📖 Verbos</a>
<a href="gramatica.html">📝 Gramática</a>
<a href="pronuncia.html">🎯 Desafios</a>
</nav>
<section>
<label>📅 Data do estudo</label>
<input type="date" id="data">
<div class="botoes">
<button onclick="mudarDia(-1)">⬅️ Dia anterior</button>
<button onclick="mudarDia(1)">Próximo dia ➡️</button>
</div>
<p class="dica">Lições preparadas aparecem automaticamente. Suas alterações são salvas neste navegador.</p>
<p id="status"></p>
</section>
<section>
<h2>🌍 O mesmo verbo em quatro idiomas</h2>
<div class="grid">
<div><label>🇧🇷 Português</label><input id="verbo-pt"></div>
<div><label>🇬🇧 Inglês</label><input id="verbo-en"></div>
<div><label>🇫🇷 Francês</label><input id="verbo-fr"></div>
<div><label>🇪🇸 Espanhol</label><input id="verbo-es"></div>
</div>
</section>
<div id="idiomas"></div>
<section>
<h2>🔎 Gramática comparada</h2>
<label>Semelhanças e diferenças</label>
<textarea id="comparacao"></textarea>
<label>💡 Dicas para memorizar</label>
<textarea id="dicas"></textarea>
</section>
<section>
<button onclick="salvar()">💾 Salvar agora</button>
<button onclick="restaurar()">🔄 Restaurar lição preparada</button>
</section>
</main>
<script>
const nomes=[
["pt","🇧🇷 Português"],
["en","🇬🇧 Inglês"],
["fr","🇫🇷 Francês"],
["es","🇪🇸 Espanhol"]
];
const tempos=["presente","passado","futuro"];
const banco=[
{
v:["estudar","to study","étudier","estudiar"],
pt:["Eu estudo\nVocê estuda\nNós estudamos\nEles estudam","Eu estudei\nVocê estudou\nNós estudamos\nEles estudaram","Eu estudarei\nVocê estudará\nNós estudaremos\nEles estudarão","Eu estudo todos os dias."],
en:["I study\nYou study\nWe study\nThey study","I studied\nYou studied\nWe studied\nThey studied","I will study\nYou will study\nWe will study\nThey will study","I study every day."],
fr:["J'étudie\nTu étudies\nNous étudions\nIls étudient","J'ai étudié\nTu as étudié\nNous avons étudié\nIls ont étudié","J'étudierai\nTu étudieras\nNous étudierons\nIls étudieront","J'étudie tous les jours."],
es:["Yo estudio\nTú estudias\nNosotros estudiamos\nEllos estudian","Yo estudié\nTú estudiaste\nNosotros estudiamos\nEllos estudiaron","Yo estudiaré\nTú estudiarás\nNosotros estudiaremos\nEllos estudiarán","Estudio todos los días."],
c:"O inglês usa studied no passado e will study no futuro. O francês usa o auxiliar avoir no passado composto. Português e espanhol apresentam terminações semelhantes.",
d:"Study → studied. Étudier → j'ai étudié."
},
{
v:["aprender","to learn","apprendre","aprender"],
pt:["Eu aprendo\nVocê aprende\nNós aprendemos\nEles aprendem","Eu aprendi\nVocê aprendeu\nNós aprendemos\nEles aprenderam","Eu aprenderei\nVocê aprenderá\nNós aprenderemos\nEles aprenderão","Eu aprendo novas palavras."],
en:["I learn\nYou learn\nWe learn\nThey learn","I learned\nYou learned\nWe learned\nThey learned","I will learn\nYou will learn\nWe will learn\nThey will learn","I learn new words."],
fr:["J'apprends\nTu apprends\nNous apprenons\nIls apprennent","J'ai appris\nTu as appris\nNous avons appris\nIls ont appris","J'apprendrai\nTu apprendras\nNous apprendrons\nIls apprendront","J'apprends de nouveaux mots."],
es:["Yo aprendo\nTú aprendes\nNosotros aprendemos\nEllos aprenden","Yo aprendí\nTú aprendiste\nNosotros aprendimos\nEllos aprendieron","Yo aprenderé\nTú aprenderás\nNosotros aprenderemos\nEllos aprenderán","Aprendo palabras nuevas."],
c:"Learn tem passado learned (também learnt). O francês apprendre tem o particípio appris.",
d:"Learn → learned. Apprendre → appris."
},
{
v:["falar","to speak","parler","hablar"],
pt:["Eu falo\nVocê fala\nNós falamos\nEles falam","Eu falei\nVocê falou\nNós falamos\nEles falaram","Eu falarei\nVocê falará\nNós falaremos\nEles falarão","Eu falo português."],
en:["I speak\nYou speak\nWe speak\nThey speak","I spoke\nYou spoke\nWe spoke\nThey spoke","I will speak\nYou will speak\nWe will speak\nThey will speak","I speak Portuguese."],
fr:["Je parle\nTu parles\nNous parlons\nIls parlent","J'ai parlé\nTu as parlé\nNous avons parlé\nIls ont parlé","Je parlerai\nTu parleras\nNous parlerons\nIls parleront","Je parle portugais."],
es:["Yo hablo\nTú hablas\nNosotros hablamos\nEllos hablan","Yo hablé\nTú hablaste\nNosotros hablamos\nEllos hablaron","Yo hablaré\nTú hablarás\nNosotros hablaremos\nEllos hablarán","Hablo portugués."],
c:"Speak é irregular: speak, spoke, spoken. Parler e hablar seguem padrões regulares.",
d:"Speak → spoke → spoken."
},
{
v:["escrever","to write","écrire","escribir"],
pt:["Eu escrevo\nVocê escreve\nNós escrevemos\nEles escrevem","Eu escrevi\nVocê escreveu\nNós escrevemos\nEles escreveram","Eu escreverei\nVocê escreverá\nNós escreveremos\nEles escreverão","Eu escrevo uma frase."],
en:["I write\nYou write\nWe write\nThey write","I wrote\nYou wrote\nWe wrote\nThey wrote","I will write\nYou will write\nWe will write\nThey will write","I write a sentence."],
fr:["J'écris\nTu écris\nNous écrivons\nIls écrivent","J'ai écrit\nTu as écrit\nNous avons écrit\nIls ont écrit","J'écrirai\nTu écriras\nNous écrirons\nIls écriront","J'écris une phrase."],
es:["Yo escribo\nTú escribes\nNosotros escribimos\nEllos escriben","Yo escribí\nTú escribiste\nNosotros escribimos\nEllos escribieron","Yo escribiré\nTú escribirás\nNosotros escribiremos\nEllos escribirán","Escribo una frase."],
c:"Write é irregular: write, wrote, written. Écrire apresenta alterações de radical.",
d:"Write → wrote → written."
},
{
v:["ler","to read","lire","leer"],
pt:["Eu leio\nVocê lê\nNós lemos\nEles leem","Eu li\nVocê leu\nNós lemos\nEles leram","Eu lerei\nVocê lerá\nNós leremos\nEles lerão","Eu leio um artigo."],
en:["I read\nYou read\nWe read\nThey read","I read\nYou read\nWe read\nThey read","I will read\nYou will read\nWe will read\nThey will read","I read an article."],
fr:["Je lis\nTu lis\nNous lisons\nIls lisent","J'ai lu\nTu as lu\nNous avons lu\nIls ont lu","Je lirai\nTu liras\nNous lirons\nIls liront","Je lis un article."],
es:["Yo leo\nTú lees\nNosotros leemos\nEllos leen","Yo leí\nTú leíste\nNosotros leímos\nEllos leyeron","Yo leeré\nTú leerás\nNosotros leeremos\nEllos leerán","Leo un artículo."],
c:"Read tem a mesma escrita no presente e passado, mas pronúncia diferente. Em francês, o particípio é lu.",
d:"Read: presente /riːd/, passado /rɛd/."
},
{
v:["compreender","to understand","comprendre","comprender"],
pt:["Eu compreendo\nVocê compreende\nNós compreendemos\nEles compreendem","Eu compreendi\nVocê compreendeu\nNós compreendemos\nEles compreenderam","Eu compreenderei\nVocê compreenderá\nNós compreenderemos\nEles compreenderão","Eu compreendo a pergunta."],
en:["I understand\nYou understand\nWe understand\nThey understand","I understood\nYou understood\nWe understood\nThey understood","I will understand\nYou will understand\nWe will understand\nThey will understand","I understand the question."],
fr:["Je comprends\nTu comprends\nNous comprenons\nIls comprennent","J'ai compris\nTu as compris\nNous avons compris\nIls ont compris","Je comprendrai\nTu comprendras\nNous comprendrons\nIls comprendront","Je comprends la question."],
es:["Yo comprendo\nTú comprendes\nNosotros comprendemos\nEllos comprenden","Yo comprendí\nTú comprendiste\nNosotros comprendimos\nEllos comprendieron","Yo comprenderé\nTú comprenderás\nNosotros comprenderemos\nEllos comprenderán","Comprendo la pregunta."],
c:"Understand tem passado understood. Em francês, comprendre apresenta particípio compris.",
d:"Understand → understood. Comprendre → compris."
},
{
v:["viver","to live","vivre","vivir"],
pt:["Eu vivo\nVocê vive\nNós vivemos\nEles vivem","Eu vivi\nVocê viveu\nNós vivemos\nEles viveram","Eu viverei\nVocê viverá\nNós viveremos\nEles viverão","Eu vivo com esperança."],
en:["I live\nYou live\nWe live\nThey live","I lived\nYou lived\nWe lived\nThey lived","I will live\nYou will live\nWe will live\nThey will live","I live with hope."],
fr:["Je vis\nTu vis\nNous vivons\nIls vivent","J'ai vécu\nTu as vécu\nNous avons vécu\nIls ont vécu","Je vivrai\nTu vivras\nNous vivrons\nIls vivront","Je vis avec espoir."],
es:["Yo vivo\nTú vives\nNosotros vivimos\nEllos viven","Yo viví\nTú viviste\nNosotros vivimos\nEllos vivieron","Yo viviré\nTú vivirás\nNosotros viviremos\nEllos vivirán","Vivo con esperanza."],
c:"Live é regular: lived. Vivre é irregular e tem particípio vécu.",
d:"Live → lived. Vivre → vécu."
}
];

const area=document.getElementById("idiomas");
const data=document.getElementById("data");
const status=document.getElementById("status");
const prefixo="4idiomas-v5-verbo-";
let carregando=false;
let espera;

nomes.forEach(([codigo,nome])=>{
 const sec=document.createElement("section");
 const h=document.createElement("h2");
 h.textContent=nome;
 sec.appendChild(h);
 tempos.forEach(tempo=>{
  const label=document.createElement("label");
  label.textContent=tempo.charAt(0).toUpperCase()+tempo.slice(1)+" — conjugação";
  const campo=document.createElement("textarea");
  campo.id=codigo+"-"+tempo;
  sec.append(label,campo);
 });
 const label=document.createElement("label");
 label.textContent="Frases de exemplo";
 const exemplo=document.createElement("textarea");
 exemplo.id=codigo+"-exemplos";
 sec.append(label,exemplo);
 const obsLabel=document.createElement("label");
 obsLabel.textContent="Observações e pronúncia";
 const obs=document.createElement("textarea");
 obs.id=codigo+"-observacoes";
 sec.append(obsLabel,obs);
 area.appendChild(sec);
});

const campos=Array.from(document.querySelectorAll("input:not([type=date]),textarea"));

function hoje(){
 const d=new Date();
 return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
}
function chave(){return prefixo+data.value}
function indice(){
 const p=data.value.split("-").map(Number);
 const n=Math.floor(Date.UTC(p[0],p[1]-1,p[2])/86400000);
 return ((n%banco.length)+banco.length)%banco.length;
}
function preencher(){
 const l=banco[indice()];
 nomes.forEach(([codigo],i)=>{
  document.getElementById("verbo-"+codigo).value=l.v[i];
  tempos.forEach((tempo,j)=>{
   document.getElementById(codigo+"-"+tempo).value=l[codigo][j];
  });
  document.getElementById(codigo+"-exemplos").value=l[codigo][3];
  document.getElementById(codigo+"-observacoes").value="";
 });
 document.getElementById("comparacao").value=l.c;
 document.getElementById("dicas").value=l.d;
}
function salvar(){
 if(carregando||!data.value)return;
 const registro={};
 campos.forEach(c=>registro[c.id]=c.value);
 try{
  localStorage.setItem(chave(),JSON.stringify(registro));
  status.textContent="✓ Estudo salvo para "+data.value;
 }catch(e){
  status.textContent="Não foi possível salvar.";
 }
}
function carregar(){
 if(!data.value)return;
 clearTimeout(espera);
 carregando=true;
 preencher();
 try{
  const registro=JSON.parse(localStorage.getItem(chave())||"null");
  if(registro){
   campos.forEach(c=>{
    if(Object.prototype.hasOwnProperty.call(registro,c.id)){
     
if(registro[c.id] !== "") c.value=registro[c.id];

    }
   });
   status.textContent="✓ Estudo recuperado.";
  }else{
   status.textContent="✓ Lição preenchida automaticamente.";
  }
 }catch(e){
  status.textContent="✓ Lição preparada.";
 }
 carregando=false;
}
function mudarDia(n){
 if(!data.value)return;
 clearTimeout(espera);
 salvar();
 const p=data.value.split("-").map(Number);
 const d=new Date(p[0],p[1]-1,p[2]+n,12);
 data.value=[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
 carregar();
}
function restaurar(){
 if(!confirm("Substituir suas alterações pela lição preparada?"))return;
 carregando=true;
 preencher();
 carregando=false;
 salvar();
}
campos.forEach(c=>{
 c.addEventListener("input",()=>{
  if(carregando)return;
  clearTimeout(espera);
  espera=setTimeout(salvar,400);
 });
});
data.addEventListener("change",carregar);
data.value=hoje();
carregar();
</script>
</body>
</html>
